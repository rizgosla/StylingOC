<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface);overflow:hidden;height:215px}.wrap{padding:24px 28px;height:100%;box-sizing:border-box}
.mono{font-family:var(--font-label);font-size:9px;font-weight:300;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}
.lbl{font-family:var(--font-label);font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink)}</style></head><body><div class="wrap"><div style="display:grid;grid-template-columns:1fr 1fr;gap:26px">
<div>
<div style="height:1px;background:var(--rule-black)"></div><div class="mono" style="margin:8px 0 20px">rule-black · section openers</div>
<div style="height:1px;background:var(--rule-strong)"></div><div class="mono" style="margin:8px 0 20px">rule-strong · 45% · inputs, hover</div>
<div style="height:1px;background:var(--rule)"></div><div class="mono" style="margin:8px 0 20px">rule · 18% · columns, captions</div>
<div style="width:44px;height:1px;background:var(--accent)"></div><div class="mono" style="margin-top:8px">accent rule · 44px max</div>
</div>
<div style="position:relative;height:150px;background:url('../assets/images/interior-living-marble.jpeg') center/cover">
<div style="position:absolute;inset:0;background:var(--overlay-scrim)"></div>
<div style="position:absolute;bottom:10px;left:12px;font-family:var(--font-label);font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:#fff">overlay-scrim</div>
</div></div></div></body></html>
