<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface);overflow:hidden;height:205px}.wrap{padding:24px 28px;height:100%;box-sizing:border-box}
.mono{font-family:var(--font-label);font-size:9px;font-weight:300;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}
.lbl{font-family:var(--font-label);font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink)}</style></head><body><div class="wrap"><div style="display:grid;grid-template-columns:repeat(12,1fr);gap:6px">
<div style="height:20px;background:var(--surface-sunken)"></div><div style="height:20px;background:var(--surface-sunken)"></div><div style="height:20px;background:var(--surface-sunken)"></div><div style="height:20px;background:var(--surface-sunken)"></div><div style="height:20px;background:var(--surface-sunken)"></div><div style="height:20px;background:var(--surface-sunken)"></div><div style="height:20px;background:var(--surface-sunken)"></div><div style="height:20px;background:var(--surface-sunken)"></div><div style="height:20px;background:var(--surface-sunken)"></div><div style="height:20px;background:var(--surface-sunken)"></div><div style="height:20px;background:var(--surface-sunken)"></div><div style="height:20px;background:var(--surface-sunken)"></div>
<div style="grid-column:1 / span 6;height:32px;background:var(--gray-300)"></div>
<div style="grid-column:8 / span 4;height:32px;background:var(--gray-400)"></div>
<div style="grid-column:1 / span 3;height:32px;background:var(--gray-300)"></div>
<div style="grid-column:5 / span 5;height:32px;background:var(--gray-400)"></div>
<div style="grid-column:11 / span 2;height:32px;background:var(--gray-300)"></div>
</div>
<div class="mono" style="margin-top:16px">max-page 1560px · grid-gap clamp(14px,1.6vw,26px)</div></div></body></html>
