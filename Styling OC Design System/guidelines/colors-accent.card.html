<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface);overflow:hidden;height:285px}.wrap{padding:24px 28px;height:100%;box-sizing:border-box}
.mono{font-family:var(--font-label);font-size:9px;font-weight:300;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}
.lbl{font-family:var(--font-label);font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink)}</style></head><body><div class="wrap"><div style="display:flex;gap:12px;align-items:flex-start">
<div style="flex:1"><div style="height:72px;background:#C2A164;border:1px solid var(--rule)"></div><div class="lbl" style="margin-top:8px">brass-300</div><div class="mono" style="margin-top:4px">#C2A164</div></div><div style="flex:1"><div style="height:72px;background:#9C7C4A;border:1px solid var(--rule)"></div><div class="lbl" style="margin-top:8px">accent</div><div class="mono" style="margin-top:4px">#9C7C4A</div></div><div style="flex:1"><div style="height:72px;background:#7E6238;border:1px solid var(--rule)"></div><div class="lbl" style="margin-top:8px">accent-strong</div><div class="mono" style="margin-top:4px">#7E6238</div></div><div style="flex:1"><div style="height:72px;background:#65502F;border:1px solid var(--rule)"></div><div class="lbl" style="margin-top:8px">accent-deep</div><div class="mono" style="margin-top:4px">#65502F</div></div>
</div>
<div style="display:flex;gap:34px;align-items:center;margin-top:22px;border-top:1px solid var(--rule-black);padding-top:18px">
<span style="font-family:var(--font-display);font-size:30px;color:var(--accent)">01 &nbsp;02 &nbsp;03</span>
<span style="font-family:var(--font-label);font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent-strong)">Interior Design</span>
<span style="width:44px;height:1px;background:var(--accent)"></span>
<span style="font-family:var(--font-label);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#fff;background:var(--accent);padding:11px 18px">Inquire</span>
</div>
<div class="mono" style="margin-top:16px;line-height:1.8">accent for numerals, rules and marks 24px+ · accent-strong for label text and links</div></div></body></html>
