<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 150px;background:#fff;overflow:hidden}
.main{display:grid;place-items:center;background:#fff}
.mark{font-family:var(--font-display);font-weight:500;color:#252321;font-size:148px;letter-spacing:.08em;line-height:1;white-space:nowrap}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip div{width:100%;height:100%}</style></head>
<body><div class="main"><div class="mark">Styling OC</div></div>
<div class="strip"><div style="background:#C2A164"></div><div style="background:#9C7C4A"></div><div style="background:#7E6238"></div><div style="background:#141414"></div></div>
</body></html>
